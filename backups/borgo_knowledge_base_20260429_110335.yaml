checkout:
  answer: 'Check-out Prozedur:


    Zeit: Bis 10:00 Uhr


    VOR Abreise:

    1. Zimmer/Haus aufräumen, durchfegen

    2. Die Unterkunft durchsaugen und wischen

    3. Müll rausbringen (korrekt getrennt!)

    4. Geschirr spülen, Küche sauber hinterlassen

    5. Bettwäsche mitnehmen (selber waschen!)

    6. Fenster schließen

    7. Heizung runterdrehen

    8. Licht & Geräte ausschalten

    9. Schlüssel in Tresor zurücklegen

    10. Gas nachbestellen (falls verbraucht)

    11. Tür abschließen


    Grundprinzip: Haus so hinterlassen wie du es vorgefunden hast!


    Danke & Gute Heimreise! 🙏

    '
