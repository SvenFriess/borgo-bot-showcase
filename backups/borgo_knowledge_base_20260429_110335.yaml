bettwaesche:
  answer: '**Bettwäsche und Handtücher:**


    **Grundregel:**

    Bettwäsche bitte SELBER MITBRINGEN und zu Hause waschen.


    **Notfall-Ausleihe:**

    Nur wenn mit jemandem vor Ort besprochen, der sich um die Wäsche kümmert, kann
    eine Ausnahme gemacht werden.


    **Lagerort für Notfall-Bettwäsche:**

    Unten im Schrank in der Villa Barsotti, wo auch die Waschmaschine steht.


    **Kosten:**

    Details zu eventuellen Kosten stehen im Benvenuti-Guide.


    ℹ️ Bei Fragen: Onsite-Gruppe kontaktieren

    '
