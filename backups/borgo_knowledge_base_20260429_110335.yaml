feuer:
  answer: 'Brandschutz im Borgo:


    Feuerlöscher:

    • In Villa Barsotti

    • In anderen Haupthäusern

    • Standorte markiert


    Bei Feuer:

    1. Ruhe bewahren

    2. Menschen in Sicherheit bringen

    3. Feuerwehr 115 rufen

    4. Kleine Brände: Feuerlöscher nutzen

    5. Bei Ausbreitung: SOFORT evakuieren


    Vorbeugung:

    • Keine Kerzen unbeaufsichtigt

    • Pizzaofen: Asche vollständig abkühlen lassen

    • Rauchen: Zigaretten IMMER vollständig löschen


    Waldbrandgefahr im Sommer:

    • Kein offenes Feuer im Wald

    • Besondere Vorsicht bei Trockenheit


    Sammelplatz bei Evakuierung: Hauptplatz vor Villa

    '
