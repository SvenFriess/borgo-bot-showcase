entscheidungsprozess:
  answer: 'Borgo Batone nutzt einen konsensbasierten Entscheidungsprozess:


    1️⃣ Vorschlag in der Community-Gruppe teilen

    → Jedes Mitglied kann Vorschläge einbringen


    2️⃣ Diskussion und Feedback sammeln (mindestens 48 Stunden)

    → Alle haben Zeit, sich zu informieren und mitzureden


    3️⃣ Bei Konsens: Umsetzung kann starten

    → Gemeinsame Zustimmung bedeutet grünes Licht


    4️⃣ Bei Uneinigkeit: Moderation durch das Kernteam

    → Vermittlung und Lösungsfindung


    Dieser transparente Prozess stellt sicher, dass alle Stimmen gehört werden und
    Entscheidungen gemeinsam getragen werden.


    📖 Details: Book of Knowledge, Kapitel 2.3 - Entscheidungsprozesse

    '
