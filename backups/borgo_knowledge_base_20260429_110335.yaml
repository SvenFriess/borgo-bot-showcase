muell:
  answer: 'Müllentsorgung im Borgo:


    Trennung nach:

    • Glas (Vetro)

    • Papier/Karton (Carta)

    • Plastik/Metall (Plastica/Metallo)

    • Organisch (Organico/Umido)

    • Restmüll (Secco/Non Riciclabile)


    Standorte: Zentrale Müllstationen im Borgo


    WICHTIG:

    • IMMER korrekt trennen!

    • Tonnen nicht überfüllen

