pizzaofen:
  answer: '**Pizzaofen Anleitung:**


    **1. Vorbereitung:**

    - Großes Feuer auf heißem Stein mittig entfachen

    - 45-60 Minuten vorheizen (Steintemperatur wichtig!)


    **2. Backen:**

    - Feuer zur Seite schieben

    - Pizzen auf heißem Stein backen (2-3 Min)


    **3. Nach Nutzung - WICHTIG:**


    ⚠️ **AUF KEINEN FALL die Glut im Ofen mit Wasser löschen!**

    Das beschädigt den Ofen!!


    **Richtige Methode:**

    1. Glut auseinanderziehen

    2. Reste in einen Eiseneimer füllen und dort ablöschen

    3. ODER: Asche im Ofen verteilt auskühlen lassen

    4. Am nächsten Tag: Kalte Asche rausholen und im Restmüll entsorgen


    **Holz:** An markierten Stellen im Borgo (siehe Holz-Stapel Info)


    **Sicherheit:**

    - Kinder niemals unbeaufsichtigt lassen

    - Feuerlöscher bereithalten

    - Nicht bei starkem Wind nutzen

    '
