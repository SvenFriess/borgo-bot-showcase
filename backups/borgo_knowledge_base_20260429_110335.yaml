schaedlingsbekaempfung:
  answer: 'Schädlingsbekämpfung im Borgo:

    ⚠️ WICHTIG für Hundebesitzer und Eltern:

    Auf dem Gelände stehen aktuell gesicherte Köderboxen (schwarze "Best Box" Stationen)
    der Firma Romani.


    Diese enthalten:

    • Giftköder (Rattengift) — in gesicherten, befestigten Boxen

    • Giftfreie Schlagfallen


    Die Boxen sind speziell gesichert, sodass Hunde und Menschen keinen Zugang zum
    Gift haben.

    Eine Karte mit allen Positionen der Fallen liegt vor — bitte die Onsite-Gruppe
    kontaktieren.


    Die Boxen werden in ca. 2–3 Wochen wieder abgeholt.


    Bei Fragen: Borgo-Onsite-Gruppe kontaktieren.

    '
