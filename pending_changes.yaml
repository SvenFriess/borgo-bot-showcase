  new_data:
    answer: 'Wandern um Borgo Batone:


      Umgebung: Toskanische Hügel, schöne Trails


      Schwierigkeit: Leicht bis mittel


      Es gibt eine Gruppe Borgo Batone bei Komoot. Dort sind einige Wanderungen gespeichert.


      Ausrüstung: Festes Schuhwerk empfohlen!


      Tipp:

      • Onsite-Gruppe nach Routen fragen

      • Wasser mitnehmen

      • Schlangen-Bewusstsein (siehe Schlangen-Eintrag)'
