- id: 17058b65-d26e-4926-ae1d-319563f1af81
  short_id: 17058B
  action: create
  entry_key: quelle
  new_data:
    category: general
    priority: medium
    synonyms:
    - quelle
    - wasser
    - brunnen
    answer: "Die Quelle ist hier. Auf dem Weg dorthin findet ihr die beiden Zisternen,\
      \ die hinter einem Zaun liegen.  https://www.google.com/maps?q=43.9317440,10.4162580&entry=gps&shh=CAE&lucs=,94297699,94284457,94231188,94280568,47071704,94218641,94282134,94286869&g_ep=CAISEjI2LjE2LjAuODk4OTU0MjE1MBgAINeCAypILDk0Mjk3Njk5LDk0Mjg0NDU3LDk0MjMxMTg4LDk0MjgwNTY4LDQ3MDcxNzA0LDk0MjE4NjQxLDk0MjgyMTM0LDk0Mjg2ODY5QgJERQ%3D%3D&skid=4ceea7bf-acd7-46e7-9533-cd31540ab885&g_st=isi\
      \ \n\nDen Weg zur Quelle findest du auf Komoot “BB Wassereinspeisung”. Die Gruppe\
      \ heisst Borgo Batone. \nhttps://www.komoot.com/de-DE/tour/2916690812?ref=itd&share_token=a3riG6U0cF7gDNNg1PPN5ooSolhjtm2b93qsvXooh9AFOImRge&ref=its\
      \ \n\nSowohl Zisternen als auch die Quelle sind abgeschlossen. Für die Zisterne\
      \ und für die Quelle benötigt ihr Schlüssel. Diese hängen am Schlüsselbrett\
      \ unter Quelle. Nehmt alle mit, bevor ihr euch auf den Weg macht. Ebenfalls\
      \ solltet ihr eine Gartenschere dabei haben und festes Schuhwerk, lange Hose,\
      \ da der Weg häufig zuwächst."
  old_data: null
  editor: kb-editor
  status: pending
  created_at: '2026-04-28T19:03:19.174563'
  resolved_at: null
